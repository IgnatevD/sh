<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Eliz Happy Travel — гірські пригоди з гідом Лізою</title>
    <meta name="description" content="Походи в гори, трекінг та авторські тури з гірським гідом Лізою Земсковою: Монблан, Доломіти, Балкани, Лапландія." />
    <meta property="og:title" content="Eliz Happy Travel — гірські пригоди" />
    <meta property="og:description" content="Трекінг і авторські тури Альпами, Балканами та Лапландією з гірським гідом." />
    <meta property="og:image" content="https://res2.weblium.site/res/65cb5fe063b9d7000f1ece66/661bb5da7f70f9000ff84ad7_optimized" />
    <meta name="theme-color" content="#0f1714" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res2.weblium.site" />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('eht-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <!-- Netlify Forms: hidden static copy so Netlify detects the booking form at build time -->
    <form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="contact" /><input name="tour" /><input name="people" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
