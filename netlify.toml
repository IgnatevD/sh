[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# SPA fallback (API routes are served by functions in netlify/functions with config.path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
